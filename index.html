<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jualan Gue — Rekomendasi Produk Shopee Pilihan</title>
  <meta name="description" content="Koleksi kurasi produk Shopee pilihan, terlaris, dan harga terbaik." />
  
  <!-- Theme Color: Shopee Orange -->
  <meta name="theme-color" content="#EE4D2D" />

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Preconnect & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Lenis Smooth Scroll & GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>
    /* ==========================================================================
       DESIGN TOKENS (Shopee Orange #EE4D2D on Obsidian Dark)
       ========================================================================== */
    :root {
      --bg: #0B0B0D;            /* Clean dark background */
      --surface: #151518;       /* Elevated dark card */
      --surface-hover: #1C1C22; /* Card hover state */
      --surface-glass: rgba(15, 15, 18, 0.78);
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      
      --text-main: #EDEDEE;     /* Off-white primary text */
      --text-muted: #8E8E93;    /* Tertiary slate */
      
      /* Sole Accent: Shopee Orange */
      --shopee-orange: #EE4D2D;
      --shopee-gradient: linear-gradient(135deg, #F53D2D 0%, #FF7337 100%);
      --shopee-glow: rgba(238, 77, 45, 0.28);
      --shopee-border: rgba(238, 77, 45, 0.4);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --font-base: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-base);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--shopee-orange);
      outline-offset: 3px;
    }

    /* ==========================================================================
       NAVBAR (Category Chips ONLY + Sliding Pill)
       ========================================================================== */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 768px) {
      .header-inner {
        padding: 14px 28px;
      }
    }

    .nav-wrapper {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      display: flex;
      justify-content: flex-start;
    }
    @media (min-width: 768px) {
      .nav-wrapper {
        justify-content: center;
      }
    }
    .nav-wrapper::-webkit-scrollbar {
      display: none;
    }

    .nav-track {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 2px 4px;
    }

    .sliding-pill {
      position: absolute;
      top: 2px;
      left: 0;
      height: calc(100% - 4px);
      border-radius: var(--radius-full);
      background: var(--shopee-gradient);
      box-shadow: 0 2px 10px var(--shopee-glow);
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: width 0.35s var(--transition-smooth), transform 0.35s var(--transition-smooth), opacity 0.2s ease;
    }

    .chip-btn {
      position: relative;
      z-index: 2;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: var(--radius-full);
      white-space: nowrap;
      transition: color 0.3s ease;
    }

    .chip-btn:hover {
      color: var(--text-main);
    }

    .chip-btn.active {
      color: #FFFFFF;
      font-weight: 700;
    }

    /* ==========================================================================
       MAIN CONTAINER
       ========================================================================== */
    main.catalog-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 16px 80px;
      width: 100%;
      flex: 1;
    }

    @media (min-width: 768px) {
      main.catalog-container {
        padding: 32px 28px 100px;
      }
    }

    /* ==========================================================================
       HERO CAROUSEL: "PRODUK TERLARIS" (Top 5-6 sales)
       ========================================================================== */
    .hero-section {
      margin-bottom: 48px;
    }

    .hero-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .hero-flame-icon {
      width: 20px;
      height: 20px;
      fill: var(--shopee-orange);
      stroke: var(--shopee-orange);
    }

    .hero-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hero-slider-wrap {
      position: relative;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .hero-slider-track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .hero-slider-track::-webkit-scrollbar {
      display: none;
    }

    .hero-slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .hero-slide {
        grid-template-columns: 46% 54%;
        min-height: 380px;
        max-height: 420px;
      }
    }

    .hero-media {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #101014;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-media {
        aspect-ratio: auto;
        height: 100%;
      }
    }

    .hero-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s var(--transition-smooth);
    }

    .hero-slide:hover .hero-media img {
      transform: scale(1.04);
    }

    .hero-details {
      padding: 24px 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, rgba(21, 21, 24, 0.8) 0%, rgba(21, 21, 24, 1) 100%);
    }

    @media (min-width: 768px) {
      .hero-details {
        padding: 36px 44px;
        gap: 16px;
      }
    }

    .hero-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hero-badge-pill {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--shopee-gradient);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hero-sales-tag {
      font-size: 13px;
      color: var(--text-muted);
    }

    .hero-product-title {
      font-size: 19px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .hero-product-title {
        font-size: 24px;
      }
    }

    .hero-pricing-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 4px;
    }

    .hero-price {
      font-size: 26px;
      font-weight: 700;
      color: var(--shopee-orange);
      letter-spacing: -0.02em;
    }

    @media (min-width: 768px) {
      .hero-price {
        font-size: 32px;
      }
    }

    .hero-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      margin-top: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      background: var(--shopee-gradient);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 16px var(--shopee-glow);
      transition: transform 0.3s var(--transition-smooth), box-shadow 0.3s ease;
    }

    .hero-slide:hover .hero-cta-btn {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(238, 77, 45, 0.45);
    }

    .hero-cta-btn svg {
      width: 17px;
      height: 17px;
      stroke: #FFFFFF;
      fill: none;
      stroke-width: 2.2;
    }

    /* Hero Progress Bar */
    .hero-progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
    }

    .hero-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--shopee-gradient);
      transition: width 0.1s linear;
    }

    /* ==========================================================================
       CATEGORY GRID & 4:5 CARDS
       ========================================================================== */
    .category-section {
      margin-bottom: 56px;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 4px;
    }

    .category-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    @media (min-width: 768px) {
      .category-title {
        font-size: 24px;
      }
    }

    .category-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
    }

    @media (min-width: 1024px) {
      .product-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 22px;
      }
    }

    /* ==========================================================================
       PRODUCT CARD (Entire Card is an <a> tag linking to Shopee)
       ========================================================================== */
    .product-card-link {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s var(--transition-smooth);
    }

    .product-card-link:hover {
      background: var(--surface-hover);
      border-color: var(--shopee-border);
      transform: translateY(-3px);
    }

    .product-card-link:active {
      transform: scale(0.975);
    }

    /* Multi-Photo Carousel in Card */
    .card-carousel-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #101014;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    .carousel-slide {
      flex: 0 0 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s var(--transition-smooth);
    }

    .product-card-link:hover .carousel-img {
      transform: scale(1.05);
    }

    /* Desktop Navigation Arrows (Visible on card hover) */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: rgba(11, 11, 13, 0.75);
      border: 1px solid var(--border);
      color: #FFFFFF;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s ease, background 0.2s ease;
    }

    @media (hover: hover) and (pointer: fine) {
      .carousel-arrow {
        display: flex;
      }
      .product-card-link:hover .carousel-arrow {
        opacity: 1;
      }
    }

    .carousel-arrow.prev { left: 8px; }
    .carousel-arrow.next { right: 8px; }
    .carousel-arrow:hover { background: rgba(238, 77, 45, 0.85); }
    .carousel-arrow svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* Carousel Dots Indicator */
    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 5px;
      z-index: 4;
      pointer-events: none;
    }

    .carousel-dot {
      width: 5px;
      height: 5px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.35);
      transition: background 0.3s ease, width 0.3s ease;
    }

    .carousel-dot.active {
      width: 14px;
      background: var(--shopee-orange);
    }

    /* Badges */
    .card-top-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      gap: 6px;
      z-index: 4;
      pointer-events: none;
    }

    .discount-pill {
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--shopee-orange);
      padding: 3px 7px;
      border-radius: var(--radius-full);
      line-height: 1;
    }

    /* Card Details */
    .card-info {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .card-info {
        padding: 14px 16px 16px;
      }
    }

    .card-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.7em;
      letter-spacing: -0.01em;
    }

    .card-proof {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .proof-rating {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: #EDEDEE;
      font-weight: 600;
    }

    .proof-rating svg {
      width: 12px;
      height: 12px;
      fill: var(--shopee-orange);
      stroke: var(--shopee-orange);
    }

    .proof-sales {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .card-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }

    .price-box {
      display: flex;
      flex-direction: column;
    }

    .final-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--shopee-orange);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    @media (min-width: 768px) {
      .final-price {
        font-size: 18px;
      }
    }

    /* Visual Bag Icon Indicator in Card */
    .bag-visual-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--shopee-gradient);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px var(--shopee-glow);
      transition: transform 0.3s var(--transition-smooth), box-shadow 0.3s ease;
    }

    .product-card-link:hover .bag-visual-icon {
      transform: scale(1.08);
      box-shadow: 0 4px 16px rgba(238, 77, 45, 0.5);
    }

    .bag-visual-icon svg {
      width: 17px;
      height: 17px;
      stroke: #FFFFFF;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Skeleton Shimmer */
    .shimmer {
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.02) 0%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(255, 255, 255, 0.02) 100%
      );
      background-size: 200% 100%;
      animation: shimmer 1.8s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .product-card-link:hover .carousel-img,
      .hero-slide:hover .hero-media img {
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. STICKY NAVBAR: Category Chips Only + Sliding Pill -->
  <header class="site-header">
    <div class="header-inner">
      <nav class="nav-wrapper" aria-label="Kategori Produk">
        <div class="nav-track" id="category-nav-track">
          <div class="sliding-pill" id="sliding-pill"></div>
          <button class="chip-btn active" data-category="all">Semua</button>
          <button class="chip-btn" data-category="Camilan &amp; Makanan">Camilan &amp; Makanan</button>
          <button class="chip-btn" data-category="Elektronik &amp; Gadget">Elektronik &amp; Gadget</button>
          <button class="chip-btn" data-category="Skincare &amp; Perawatan">Skincare &amp; Perawatan</button>
          <button class="chip-btn" data-category="Rumah Tangga &amp; Kosan">Rumah Tangga &amp; Kosan</button>
          <button class="chip-btn" data-category="Fashion &amp; Outfit">Fashion &amp; Outfit</button>
        </div>
      </nav>
    </div>
  </header>

  <!-- 2. MAIN CONTAINER -->
  <main class="catalog-container">

    <!-- HERO CAROUSEL: "PRODUK TERLARIS" -->
    <section class="hero-section" aria-label="Produk Terlaris">
      <div class="hero-header">
        <svg class="hero-flame-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c1.1 0 2 .9 2 2 0 1.5-1 3.5-2 5-1-1.5-2-3.5-2-5 0-1.1.9-2 2-2zm5.5 6.5c.8 0 1.5.7 1.5 1.5 0 2-1.5 4.5-3 6.5-1-1.5-1.5-3-1.5-4.5 0-1.9 1.3-3.5 3-3.5zm-11 0c1.7 0 3 1.6 3 3.5 0 1.5-.5 3-1.5 4.5-1.5-2-3-4.5-3-6.5 0-.8.7-1.5 1.5-1.5zM12 11c2.8 0 5 2.2 5 5 0 3.3-2.7 6-6 6s-6-2.7-6-6c0-2.8 2.2-5 5-5z"></path>
        </svg>
        <h1 class="hero-title">Produk Terlaris</h1>
      </div>

      <div class="hero-slider-wrap" id="hero-slider-wrap">
        <div class="hero-slider-track" id="hero-slider-track">
          <!-- Top 5 products injected here -->
        </div>
        <div class="hero-progress-track">
          <div class="hero-progress-fill" id="hero-progress-fill"></div>
        </div>
      </div>
    </section>

    <!-- CATEGORIES & CARDS ROOT -->
    <div id="categories-root">
      <!-- Injected via Python / JavaScript from data/products_verified.json -->
    </div>

  </main>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Lenis Smooth Scroll
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          duration: 1.15,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          orientation: 'vertical',
          smoothWheel: true,
          touchMultiplier: 1.8
        });
        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);
      }

      // 2. Fetch Verified Data
      let products = [];
      try {
        const res = await fetch('data/products_verified.json');
        products = await res.json();
      } catch (e) {
        console.error('Failed loading products_verified.json:', e);
        return;
      }

      // 3. Render Hero Carousel (Top 5 items by sales score)
      const topProducts = [...products].sort((a, b) => b.score - a.score).slice(0, 5);
      const heroTrack = document.getElementById('hero-slider-track');
      const progressFill = document.getElementById('hero-progress-fill');
      
      heroTrack.innerHTML = topProducts.map((p, idx) => `
        <a 
          href="${p.affiliate_url}" 
          target="_blank" 
          rel="noopener sponsored" 
          class="hero-slide" 
          data-index="${idx}"
          onclick="trackConversion('${escapeJs(p.clean_title)}', '${escapeJs(p.category)}', 'Hero Slide')"
        >
          <div class="hero-media">
            <img src="${p.image_url}" alt="${escapeHtml(p.clean_title)}" loading="${idx === 0 ? 'eager' : 'lazy'}" />
          </div>
          <div class="hero-details">
            <div class="hero-badge-row">
              <span class="hero-badge-pill">🔥 Top #${idx + 1} Terlaris</span>
              <span class="hero-sales-tag">${escapeHtml(p.sales)}</span>
            </div>
            <h2 class="hero-product-title">${escapeHtml(p.clean_title)}</h2>
            <div class="hero-pricing-row">
              <span class="hero-price">${escapeHtml(p.price_formatted)}</span>
            </div>
            <div class="hero-cta-btn">
              <span>Beli Sekarang</span>
              <svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
            </div>
          </div>
        </a>
      `).join('');

      // Hero Autoplay (Every 5s)
      let currentHeroIndex = 0;
      let heroInterval = null;
      let heroProgressVal = 0;
      let isHeroPaused = false;

      function startHeroAutoplay() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        clearInterval(heroInterval);
        heroInterval = setInterval(() => {
          if (isHeroPaused) return;
          heroProgressVal += 2;
          if (heroProgressVal >= 100) {
            heroProgressVal = 0;
            currentHeroIndex = (currentHeroIndex + 1) % topProducts.length;
            const slide = heroTrack.children[currentHeroIndex];
            if (slide) {
              heroTrack.scrollTo({ left: slide.offsetLeft, behavior: 'smooth' });
            }
          }
          progressFill.style.width = `${heroProgressVal}%`;
        }, 100);
      }

      const heroWrap = document.getElementById('hero-slider-wrap');
      heroWrap.addEventListener('mouseenter', () => { isHeroPaused = true; });
      heroWrap.addEventListener('mouseleave', () => { isHeroPaused = false; });
      heroWrap.addEventListener('touchstart', () => { isHeroPaused = true; }, { passive: true });
      heroWrap.addEventListener('touchend', () => { isHeroPaused = false; });
      startHeroAutoplay();

      // 4. Render Category Grid Cards with Multi-Photo Swiper
      const categoriesMap = {};
      products.forEach(p => {
        const c = p.category || 'Pilihan';
        if (!categoriesMap[c]) categoriesMap[c] = [];
        categoriesMap[c].push(p);
      });

      const categoriesRoot = document.getElementById('categories-root');
      let gridHtml = '';

      Object.keys(categoriesMap).forEach(cat => {
        const items = categoriesMap[cat];
        gridHtml += `
          <section class="category-section" data-category="${escapeHtml(cat)}">
            <div class="category-header">
              <h2 class="category-title">${escapeHtml(cat)}</h2>
              <span class="category-count">${items.length} Produk</span>
            </div>
            <div class="product-grid">
              ${items.map(buildProductCard).join('')}
            </div>
          </section>
        `;
      });

      categoriesRoot.innerHTML = gridHtml;
      initCarousels();
      initNavChips();

      function buildProductCard(p) {
        const images = (p.images && p.images.length > 0) ? p.images : [p.image_url];
        const hasMultiple = images.length > 1;

        let slidesHtml = images.map((img, i) => `
          <div class="carousel-slide">
            <img class="carousel-img" src="${escapeHtml(img)}" alt="${escapeHtml(p.clean_title)}" loading="${i === 0 ? 'lazy' : 'lazy'}" />
          </div>
        `).join('');

        let dotsHtml = '';
        let arrowsHtml = '';
        if (hasMultiple) {
          dotsHtml = `<div class="carousel-dots">${images.map((_, i) => `<span class="carousel-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>`;
          arrowsHtml = `
            <button class="carousel-arrow prev" aria-label="Foto Sebelumnya" type="button">
              <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="carousel-arrow next" aria-label="Foto Berikutnya" type="button">
              <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
          `;
        }

        return `
          <a 
            href="${escapeHtml(p.affiliate_url)}" 
            target="_blank" 
            rel="noopener sponsored" 
            class="product-card-link"
            data-id="${p.id}"
            onclick="handleCardClick(event, '${escapeJs(p.clean_title)}', '${escapeJs(p.category)}')"
          >
            <div class="card-carousel-wrap">
              <div class="carousel-track">
                ${slidesHtml}
              </div>
              ${arrowsHtml}
              ${dotsHtml}
            </div>
            <div class="card-info">
              <h3 class="card-name">${escapeHtml(p.clean_title)}</h3>
              <div class="card-proof">
                <span class="proof-rating">
                  <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                  ${p.rating || '4.9'}
                </span>
                <span class="proof-sales">${escapeHtml(p.sales)}</span>
              </div>
              <div class="card-footer">
                <div class="price-box">
                  <span class="final-price">${escapeHtml(p.price_formatted)}</span>
                </div>
                <div class="bag-visual-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                </div>
              </div>
            </div>
          </a>
        `;
      }

      // Drag threshold to prevent accidental link click during swipe
      let dragStartX = 0;
      let dragDistance = 0;
      window.handleCardClick = function (e, title, cat) {
        if (dragDistance > 12) {
          e.preventDefault(); // User was swiping carousel
          dragDistance = 0;
          return false;
        }
        trackConversion(title, cat, 'Card Link');
      };

      // 5. In-Card Carousel Swipe & Arrows
      function initCarousels() {
        document.querySelectorAll('.card-carousel-wrap').forEach(wrap => {
          const track = wrap.querySelector('.carousel-track');
          const dots = wrap.querySelectorAll('.carousel-dot');
          const prev = wrap.querySelector('.carousel-arrow.prev');
          const next = wrap.querySelector('.carousel-arrow.next');

          if (!track) return;

          // Track scroll snap to update dots
          track.addEventListener('scroll', () => {
            const index = Math.round(track.scrollLeft / track.offsetWidth);
            dots.forEach((d, i) => d.classList.toggle('active', i === index));
          }, { passive: true });

          // Drag distance tracking
          track.addEventListener('touchstart', (e) => {
            dragStartX = e.touches[0].clientX;
            dragDistance = 0;
          }, { passive: true });

          track.addEventListener('touchmove', (e) => {
            dragDistance = Math.abs(e.touches[0].clientX - dragStartX);
          }, { passive: true });

          if (prev && next) {
            prev.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              track.scrollBy({ left: -track.offsetWidth, behavior: 'smooth' });
            });
            next.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              track.scrollBy({ left: track.offsetWidth, behavior: 'smooth' });
            });
          }
        });
      }

      // 6. Sliding Pill Category Navigation
      function initNavChips() {
        const navTrack = document.getElementById('category-nav-track');
        const slidingPill = document.getElementById('sliding-pill');
        const chips = navTrack.querySelectorAll('.chip-btn');

        function positionPill(btn) {
          if (!btn || !slidingPill) return;
          slidingPill.style.width = `${btn.offsetWidth}px`;
          slidingPill.style.transform = `translateX(${btn.offsetLeft}px)`;
          slidingPill.style.opacity = '1';
        }

        chips.forEach(btn => {
          btn.addEventListener('click', () => {
            chips.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            positionPill(btn);
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            const cat = btn.dataset.category;
            filterCategory(cat);
          });
        });

        setTimeout(() => positionPill(navTrack.querySelector('.chip-btn.active')), 100);
      }

      function filterCategory(cat) {
        const sections = document.querySelectorAll('.category-section');
        sections.forEach(sec => {
          const match = (cat === 'all' || sec.dataset.category === cat);
          sec.style.display = match ? 'block' : 'none';
        });
      }

      // Conversion Tracker
      function trackConversion(name, cat, pos) {
        if (window.va) {
          window.va('event', {
            name: 'Affiliate Click',
            data: { product: name, category: cat, position: pos, timestamp: new Date().toISOString() }
          });
        }
      }
      window.trackConversion = trackConversion;

      function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function escapeJs(s) {
        if (!s) return '';
        return String(s).replace(/'/g, "\\'").replace(/"/g, '\\"');
      }
    });
  </script>
</body>
</html>
